# Pre-commit hooks for knotica. Install once per clone: `pre-commit install`.
#
# All four hooks are live. The tree is at zero ruff errors and zero strict-mypy
# errors, so every one of these passes on a clean checkout -- a gate that fires
# on HEAD gets uninstalled on day one.

repos:
  # ruff: pinned to the same version this project resolves in uv.lock
  # (0.15.20) so `pre-commit run` and `uv run ruff` never disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
    hooks:
      # --fix is deliberately OFF: this hook should report exactly what CI
      # would report, not silently rewrite the diff being committed. Run
      # `uv run ruff check --fix` by hand when you want auto-fixes.
      - id: ruff-check
        name: ruff check
      - id: ruff-format
        name: ruff format --check
        args: [--check]

  # Secret scanning. detect-secrets over gitleaks: pure-Python (fits the
  # project's existing uv/pip toolchain instead of a separately-managed Go
  # binary release) and its scan is fully offline/heuristic -- no network
  # call at commit time, matching this project's "no network at commit"
  # preference. .secrets.baseline pins the known false positives (test
  # fixtures for the scrub/redaction feature, doc examples of env vars).
  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a # v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: uv\.lock

  # Inbound id-citation discipline (td-014): blocks ephemeral pipeline
  # identifiers (REQ-*, AC-*, Step N, PM-N, dec-draft-<hash>, WIP.md /
  # SYSTEMS_PLAN.md / IMPLEMENTATION_PLAN.md references) from landing in
  # committed code/tests, where nothing ever rewrites or deletes them once
  # .ai-work/ is cleaned up. Local hook: no separate repo to pin, and it
  # needs no dependencies beyond the stdlib.
  - repo: local
    hooks:
      - id: id-citation-discipline
        name: id-citation discipline (inbound)
        entry: python3 scripts/check_id_citation_discipline.py --files
        language: system
        types_or: [python, ts, tsx, javascript, jsx, rust, go, java, kotlin, ruby, shell]
        pass_filenames: true

  # Strict mypy over src/knotica. Enabled now that the tree is at zero errors
  # (td-019); `pass_filenames: false` because mypy needs the whole package to
  # resolve types, not just the staged files.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src/knotica)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
