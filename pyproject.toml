[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knotica"
version = "0.1.0"
description = "AI-maintained, compounding knowledge wiki (llm-wiki): stateless MCP server + CLI over an Obsidian vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28",
    "pydantic>=2.13.4",
]

[project.scripts]
knotica = "knotica.cli:main"

[project.optional-dependencies]
# Headless server-side LLM: the unified `query` tool, DSPy compile, the eval
# harness, and loop/Arena. Opt-in and absent from the base wheel install, so
# `uvx --from … knotica mcp` stays lean and credential-free for the ingest /
# client-as-brain paths. Enable per surface without a second server or a
# re-fetch: `uvx --from <src>[evals]` (reuses the installed plugin via
# ${CLAUDE_PLUGIN_ROOT}[evals]), `pip install knotica[evals]`,
# `uv sync --extra evals`, or the Desktop `uvx --from '<repo>[evals]'` launch.
# Always request this set *by extra name*; a caller that re-lists the packages
# by hand drops the bounds below and reintroduces the macOS build failure.
#
# `litellm<1.92` is a platform-availability bound, not a feature one. dspy pulls
# litellm in transitively and needs only >=1.64. From 1.92.0 litellm moved to a
# Rust bridge and publishes manylinux + win wheels *only* — no macOS wheel at any
# version — so every macOS install builds the sdist and needs a Rust toolchain
# (1.95.0 requires rustc >=1.94.1). 1.91.4 is the last `py3-none-any` wheel, so
# this bound keeps `uv tool install --from '.[evals]'` and `uv sync` compiler-free
# on every platform and keeps CI resolving the same litellm as local runs — which
# eval-score comparability depends on. Revisit when litellm ships macOS wheels.
evals = [
    "anthropic>=0.116",
    "dspy>=3.2",
    "litellm<1.92",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # `scripts/test_group.py` parses the group blocks in
    # `.ai-state/TEST_TOPOLOGY.md`. Declared here rather than leaned on
    # transitively: pyyaml arrives today only via dspy, i.e. only under
    # `--extra evals`, so a plain `uv sync` would leave `make test-group`
    # broken for anyone who skipped the extra.
    "pyyaml",
]
# No `evals` group here on purpose. It existed as a byte-identical alias of the
# `evals` *extra* above during the dec-055 migration window; that migration is
# now complete and the alias is removed, because two hand-synced copies of one
# dependency set drift silently (nothing enforced their equality, and a
# platform bound had to be written twice). The extra is the single source of
# truth: `uv sync --extra evals`, `uv run --extra evals`,
# `uv tool install --from '.[evals]'`, `pip install knotica[evals]`,
# `uvx --from '<src>[evals]'`.

[tool.hatch.build.targets.wheel]
packages = ["src/knotica"]

# `knotica init` scaffolds new vaults from the packaged template. The template is
# authored at the repo root (vault-template/) and mapped into the wheel under
# knotica/vault-template so importlib.resources can reach it from the installed
# package. Editable/dev installs resolve the repo-root copy instead (init-time
# fallback; see docs/architecture.md).
[tool.hatch.build.targets.wheel.force-include]
"vault-template" = "knotica/vault-template"
"src/knotica/dashboard/app.html" = "knotica/dashboard/app.html"

[tool.ruff]
target-version = "py312"
line-length = 100
# Nested git worktrees live under .claude/worktrees/ and are full copies of the
# repo. Without this, `ruff check` from the repo root scans every worktree too --
# 987 files instead of 328 -- and reports "errors" that live in another branch's
# copy, which someone will eventually try to fix in the wrong place.
extend-exclude = [".claude"]

[tool.mypy]
python_version = "3.12"
strict = true
# Absolute-import project; keep error output navigable and precise.
files = ["src/knotica"]
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Scope note: `tests/` is deliberately NOT type-checked. Test code legitimately
# leans on fixtures, monkeypatching and deliberately-malformed inputs, where
# strict typing costs more than it catches. The production surface is the
# contract worth gating. Widening to `tests/` is a separate, later decision --
# not a silent omission.

[[tool.mypy.overrides]]
# Optional dependencies that may be absent from a lean environment. `dspy`
# genuinely ships no stubs; `anthropic` does ship types, so when the `evals`
# extra IS installed mypy uses them and this setting is inert. It exists so the
# gate is green both with and without `--extra evals` -- a type gate that only
# passes in one environment gets bypassed in the other.
module = ["dspy", "dspy.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `dspy` resolves to `Any` (no stubs, see the override above), and strict mode's
# `disallow_subclassing_any` therefore rejects any class that must subclass
# `dspy.Module`. No amount of local annotation can fix that -- it is a property
# of the dependency, not of this code. The relaxation is deliberately scoped to
# ONE rule in the two modules that subclass dspy; every other strict check
# still applies to them, and hand-written dspy stubs were rejected as a worse
# option (a fast-moving untyped library's stubs become a confident lie).
module = ["knotica.evals.program", "knotica.evals.harness"]
disallow_subclassing_any = false
