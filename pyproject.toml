[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knotica"
version = "0.1.0"
description = "AI-maintained, compounding knowledge wiki (llm-wiki): stateless MCP server + CLI over an Obsidian vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28",
    "pydantic>=2.13.4",
]

[project.scripts]
knotica = "knotica.cli:main"

[project.optional-dependencies]
# Headless server-side LLM: the unified `query` tool, DSPy compile, the eval
# harness, and loop/Arena. Opt-in and absent from the base wheel install, so
# `uvx --from … knotica mcp` stays lean and credential-free for the ingest /
# client-as-brain paths. Enable per surface without a second server or a
# re-fetch: `uvx --from <src>[evals]` (reuses the installed plugin via
# ${CLAUDE_PLUGIN_ROOT}[evals]), `pip install knotica[evals]`,
# `uv sync --extra evals`, or the Desktop `--with anthropic --with dspy` launch.
evals = [
    "anthropic>=0.116",
    "dspy>=3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
# Compatibility alias of the `evals` *extra* above (the source of truth) so
# existing `uv sync --group evals` dev/CI flows keep working unchanged. Same
# package set; the extra is what `uvx --from <src>[evals]` and
# `pip install knotica[evals]` resolve. Still opt-in and off the lean
# `uvx … knotica mcp` cold-start path. Consolidate to extra-only later (a
# bounded DRY cleanup once the `--group evals` call sites move to `--extra`).
evals = [
    "anthropic>=0.116",
    "dspy>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knotica"]

# `knotica init` scaffolds new vaults from the packaged template. The template is
# authored at the repo root (vault-template/) and mapped into the wheel under
# knotica/vault-template so importlib.resources can reach it from the installed
# package. Editable/dev installs resolve the repo-root copy instead (init-time
# fallback; see docs/architecture.md).
[tool.hatch.build.targets.wheel.force-include]
"vault-template" = "knotica/vault-template"
"src/knotica/dashboard/app.html" = "knotica/dashboard/app.html"

[tool.ruff]
target-version = "py312"
line-length = 100
