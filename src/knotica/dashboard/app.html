es have moved get re-pointed before the citation goes stale."}}},"answer.gap_report":{lane:"answer",stage:"react",title:"Report gap",spend:"free",mutates:!0,dispatch:"client",clientMethod:"gapReport",why:"The answer fell short of what this topic should be able to say, and an unreported gap is one nothing will ever go looking for sources against.",willDo:"Files an open gap record against this topic, in one commit. Nothing is fetched and nothing is billed. Reversible — a filed gap can be resolved or dismissed.",previewMode:"none",progressMode:"busy",outcomeMode:"refresh",outcomeFallback:"A gap is filed against this topic.",next:{kind:"always",go:{lane:"fill",stage:"discover",why:"Discovery is what turns a filed gap into ranked candidate sources — a gap nobody discovers against stays open forever."}}}},iA={"fill.gapfill_discover":{lane:"fill",stage:"discover",title:"Discover sources…",spend:"billed",mutates:!0,dispatch:"client",clientMethod:"gapfillDiscover",why:"Gaps are filed against this topic and no source has been proposed for any of them, so the queue is stalled at its first step and nothing downstream has anything to triage.",willDo:"Searches the configured provider for candidate sources for the open gaps and stages the ones that rank as suggestions. Billed — you see how many gaps would drain and the estimate before anything runs. Nothing is written into the wiki itself.",previewMode:"nonce",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"fill",stage:"approve",why:"A staged suggestion is a proposal, not a decision — nothing is ingested until someone approves it in the queue below."}}},"fill.gap_dismiss":{lane:"fill",stage:"gap",title:"Confirm dismiss",spend:"free",mutates:!0,dispatch:"client",clientMethod:"reviewGap",why:"This gap is not worth sourcing — an existing page answers it, or the question is out of scope — and while it sits open every discovery drain re-searches it and every triage pass re-reads it.",willDo:"Marks the gap dismiss stion_defer":{lane:"fill",stage:"approve",title:"⧗ Defer",spend:"free",mutates:!0,dispatch:"client",clientMethod:"suggestionsReview",why:"This one needs a judgement you are not ready to make, and guessing at it is worse than parking it where you can find it again.",willDo:"Moves the record to deferred in one commit — out of the pending list, still approvable or rejectable later. Nothing is billed and the gap stays open.",previewMode:"none",progressMode:"busy",outcomeMode:"result",next:{kind:"terminal",why:"Deferring decides nothing on purpose — the record waits here until you come back to it, and nothing downstream moves in the meantime."}},"fill.suggestion_withdraw":{lane:"fill",stage:"approve",title:"Withdraw",spend:"free",mutates:!0,dispatch:"client",clientMethod:"suggestionsReview",why:"An approval you have changed your mind about would otherwise have to be released by claiming an ingest that never happened, which writes a false record.",willDo:"Returns the record to pending in one commit, asserting nothing about whether it was ingested. Nothing is billed. Fully reversible — it is the undo for an approval.",previewMode:"none",progressMode:"busy",outcomeMode:"result",next:{kind:"terminal",why:"The record is back where it started, in this queue, still owed the decision you withdrew — there is nowhere else to be."}},"fill.ingest_dispatch":{lane:"fill",stage:"ingest",title:"Open a session",spend:"free",mutates:!1,dispatch:"handoff",clientMethod:null,why:"Only your Claude session can write into the candidate session; this surface can read that session but has no way to write a page into it.",willDo:"Sends the ingest instruction to your Claude session. Nothing is written from here — the session writes, and this list re-reads every 3 seconds as it does.",previewMode:"none",progressMode:"external",outcomeMode:"external",next:{kind:"always",go:{lane:"fill",stage:"gate",why:"An ingested source does not count for anything until the gate measures it against the topic and re m is the best this topic has and nothing improves until a fresh optimisation produces something else to measure.",willDo:"Re-optimises the prompt program against the trainset and writes the result to a new candidate branch. Billed, and the first click only arms the control. The vault's answers do not change — a candidate branch is not promoted by compiling it.",previewMode:"armed",progressMode:"busy",outcomeMode:"refresh",outcomeFallback:"A fresh candidate branch is compiled and waiting to be measured.",next:{kind:"always",go:{lane:"improve",stage:"gate",why:"A candidate is only worth having once it is scored against the baseline — until it is gated, nothing knows whether this compile was an improvement."}}},"improve.datasets_bootstrap":{lane:"improve",stage:"instrument",title:"Bootstrap",spend:"billed",mutates:!0,dispatch:"client",clientMethod:"datasetsBootstrap",why:"The golden pipeline starts empty, and with no candidate questions there is nothing to review and therefore nothing that can ever be frozen into a held-out set.",willDo:"Synthesises candidate questions from this topic's entity pages and writes them to the candidates file. Billed, and the first click only arms the control. It adds candidates; it never overwrites a reviewed or held-out set.",previewMode:"armed",progressMode:"busy",outcomeMode:"result",next:{kind:"terminal",why:"Candidates need a human verdict before they can be frozen, and this surface has no control for that review — the numbers above are the whole of what changed here."}},"improve.datasets_bootstrap_train":{lane:"improve",stage:"instrument",title:"Bootstrap trainset",spend:"billed",mutates:!0,dispatch:"client",clientMethod:"datasetsBootstrapTrain",why:"A compile optimises the prompt program against the trainset, so an empty or thin trainset caps how good any compiled candidate can be no matter how often it is run.",willDo:"Reads this topic's pages and appends labelled examples to the trainset. Billed, and the first click only arms the control. The trainset stays disjoint from the held-out set — a question the model trained on measures nothing.",previewMode:"armed",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"heal",why:"A widened trainset only pays off through a compile — that is the step that reads it and turns it into a new candidate program."}}},"improve.datasets_freeze":{lane:"improve",stage:"instrument",title:"Freeze golden",spend:"free",mutates:!0,dispatch:"client",clientMethod:"datasetsFreeze",why:"Every later comparison in this topic is made against the held-out set, so until one is frozen there is no baseline, no gate verdict and no eval scalar that means anything.",willDo:"Moves the reviewed candidates into the held-out set and commits them. Nothing is billed. Consequential rather than destructive: the frozen set becomes the stick every future scalar is measured with, and it refuses outright to freeze a set that overlaps the trainset.",previewMode:"armed",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"observe",why:"A frozen held-out set is what an eval cycle scores against — running one is how the set turns into the first number worth comparing to."}}},"improve.arena_scorer_switch":{lane:"improve",stage:"heal",title:"Use eval scorer",spend:"arms-billing",mutates:!1,dispatch:"client",clientMethod:"loopCadence",why:"The race was refused before scoring because the arena scorer and the gate baseline are not the same instrument, so no ranking between them would mean anything and every race aborts the same way until one of them changes.",willDo:"Writes the chosen scorer under `[loop]` in your config. This click bills nothing; switching to the eval scorer arms one full golden-set eval per variant on every future race. Reversible — the same control switches back.",previewMode:"armed",progressMode:"busy",outcomeMode:"result",next:{kind:"terminal",why:"Both runners rebuild from config on every tick, so the scorer takes effect without a restart and nothing else is owed here."}},"improve.branch_promote":{lane:"improve",stage:"promote",title:"Preview promote",spend:"free",mutates:!0,dispatch:"client",clientMethod:"branchPromote",why:"A candidate that cleared the baseline changes nothing while it sits on a branch — the topic keeps answering with the program it had until the branch is merged.",willDo:"Shows you exactly what merging this branch changes, and merges it only on a second, explicit click. Nothing is billed. Reversible — the merge is a normal commit.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"prove",why:"The scoreboard says it scores better; the probe is the only place you see whether it actually answers better, which is the claim the whole loop is making."}}},"improve.branch_delete":{lane:"improve",stage:"promote",title:"Preview delete",spend:"free",mutates:!0,dispatch:"client",clientMethod:"branchDelete",why:"This candidate is not going to be merged, and an open branch nobody drops keeps presenting itself for review every time this stage is opened.",willDo:"Shows you what dropping this branch removes, and drops it only on a second, explicit click. Nothing is billed and the vault keeps the program it already had — the branch goes, the wiki does not change.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"heal",why:"Dropping the candidate leaves the topic on its last promoted program, so a fresh compile is what produces something else to try."}}},"improve.probe":{lane:"improve",stage:"prove",title:"Probe it",spend:"billed",mutates:!1,dispatch:"client",clientMethod:"query",why:"A promoted program is only actually better if it answers better, and a scoreboard delta cannot tell you whether the questions this topic exists for improved.",willDo:"Asks the compiled program this question and renders the answer beside the one you pinned. It costs tokens, s  expects, and one that has fallen behind is reported against by every later check without any of them being able to fix it.",willDo:"Nothing from here: this copies the CLI dry run for you to paste. The dry run only reports what would change — applying it is a second command you run yourself.",previewMode:"dry-run",progressMode:"external",outcomeMode:"external",next:{kind:"always",go:{lane:"tend",stage:"doctor",why:"A migration rewrites the layout every other check reads, so the health report is what confirms it landed clean."}}},"tend.okf_repair":{lane:"tend",stage:"okf",title:"Repair apply",spend:"free",mutates:!0,dispatch:"client",clientMethod:"okfRepair",why:"The vault has drifted from the Open Knowledge Format, and a vault that does not match the format cannot be read by anything that expects it.",willDo:"Rewrites the files the dry run listed and records one git commit. Nothing is billed. Reversible — the commit is a normal one you can revert.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"refresh",outcomeFallback:"The repair ran and its changed files and commit are listed below.",next:{kind:"always",go:{lane:"tend",stage:"lint",why:"A repair rewrote pages, and lint is what proves those pages still validate against their schemas."}}},"tend.note_reanchor":{lane:"tend",stage:"drift",title:"Re-anchor here",spend:"free",mutates:!0,dispatch:"client",clientMethod:"notesReanchor",why:"The page moved under this note's anchor, so the note now points at text that is no longer there and cites something nobody can find.",willDo:"Repoints the anchor at the passage you chose and commits the note. Nothing is billed. Reversible — re-anchoring again moves it back.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"refresh",outcomeFallback:"The anchor now points at the passage you chose.",next:{kind:"terminal",why:"The note cites live text again — nothing downstream was waiting on it."}},"tend.note_detach":{lane:"tend",stage:"drift",title:"Detach",spend:"free",mutat
