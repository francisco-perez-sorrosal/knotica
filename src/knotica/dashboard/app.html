m is the best this topic has and nothing improves until a fresh optimisation produces something else to measure.",willDo:"Re-optimises the prompt program against the trainset and writes the result to a new candidate branch. Billed, and the first click only arms the control. The vault's answers do not change — a candidate branch is not promoted by compiling it.",previewMode:"armed",progressMode:"busy",outcomeMode:"refresh",outcomeFallback:"A fresh candidate branch is compiled and waiting to be measured.",next:{kind:"always",go:{lane:"improve",stage:"gate",why:"A candidate is only worth having once it is scored against the baseline — until it is gated, nothing knows whether this compile was an improvement."}}},"improve.datasets_bootstrap":{lane:"improve",stage:"instrument",title:"Bootstrap",spend:"billed",mutates:!0,dispatch:"client",clientMethod:"datasetsBootstrap",why:"The golden pipeline starts empty, and with no candidate questions there is nothing to review and therefore nothing that can ever be frozen into a held-out set.",willDo:"Synthesises candidate questions from this topic's entity pages and writes them to the candidates file. Billed, and the first click only arms the control. It adds candidates; it never overwrites a reviewed or held-out set.",previewMode:"armed",progressMode:"busy",outcomeMode:"result",next:{kind:"terminal",why:"Candidates need a human verdict before they can be frozen, and this surface has no control for that review — the numbers above are the whole of what changed here."}},"improve.datasets_bootstrap_train":{lane:"improve",stage:"instrument",title:"Bootstrap trainset",spend:"billed",mutates:!0,dispatch:"client",clientMethod:"datasetsBootstrapTrain",why:"A compile optimises the prompt program against the trainset, so an empty or thin trainset caps how good any compiled candidate can be no matter how often it is run.",willDo:"Reads this topic's pages and appends labelled examples to the trainset. Billed, and the first click only arms the es effect without a restart and nothing else is owed here."}},"improve.branch_promote":{lane:"improve",stage:"promote",title:"Preview promote",spend:"free",mutates:!0,dispatch:"client",clientMethod:"branchPromote",why:"A candidate that cleared the baseline changes nothing while it sits on a branch — the topic keeps answering with the program it had until the branch is merged.",willDo:"Shows you exactly what merging this branch changes, and merges it only on a second, explicit click. Nothing is billed. Reversible — the merge is a normal commit.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"prove",why:"The scoreboard says it scores better; the probe is the only place you see whether it actually answers better, which is the claim the whole loop is making."}}},"improve.branch_delete":{lane:"improve",stage:"promote",title:"Preview delete",spend:"free",mutates:!0,dispatch:"client",clientMethod:"branchDelete",why:"This candidate is not going to be merged, and an open branch nobody drops keeps presenting itself for review every time this stage is opened.",willDo:"Shows you what dropping this branch removes, and drops it only on a second, explicit click. Nothing is billed and the vault keeps the program it already had — the branch goes, the wiki does not change.",previewMode:"dry-run",progressMode:"busy",outcomeMode:"result",next:{kind:"always",go:{lane:"improve",stage:"heal",why:"Dropping the candidate leaves the topic on its last promoted program, so a fresh compile is what produces something else to try."}}},"improve.probe":{lane:"improve",stage:"prove",title:"Probe it",spend:"billed",mutates:!1,dispatch:"client",clientMethod:"query",why:"A promoted program is only actually better if it answers better, and a scoreboard delta cannot tell you whether the questions this topic exists for improved.",willDo:"Asks the compiled program this question and renders the answer beside the one you pinned. It costs tokens, s
