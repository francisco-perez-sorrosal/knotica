name: Cross-Model Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}  # least-privilege; the job below grants only the inverted-privilege ceiling

jobs:
  review:
    permissions:
      pull-requests: write
      contents: read
    uses: francisco-perez-sorrosal/praxion/.github/workflows/reusable-cross-model-review.yml@bec2259f583d86a69c95c051bdf038d9c1d2ee6f
    with:
      policy_path: .github/autofix-policy.yml
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
