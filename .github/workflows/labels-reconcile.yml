name: Labels Reconcile

on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions: {}  # least-privilege; the job below grants only the ceiling the hub needs

jobs:
  reconcile:
    permissions:
      issues: write
      contents: read
    uses: francisco-perez-sorrosal/praxion/.github/workflows/reusable-labels-reconcile.yml@664c68461605527752c85f649af1e605b813cdaa
    with:
      manifest_path: .github/labels.yml
