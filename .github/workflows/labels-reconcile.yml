name: Labels Reconcile

on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions: {}  # least-privilege; the job below grants only the ceiling the hub needs

jobs:
  reconcile:
    permissions:
      issues: write
      contents: read
    uses: francisco-perez-sorrosal/praxion/.github/workflows/reusable-labels-reconcile.yml@79f9f6b1831dfeb3a58fb045d856d000886a11f9
    with:
      manifest_path: .github/labels.yml
