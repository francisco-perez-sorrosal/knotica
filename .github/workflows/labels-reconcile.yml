name: Labels Reconcile

on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions: {}  # least-privilege; the job below grants only the ceiling the hub needs

jobs:
  reconcile:
    permissions:
      issues: write
      contents: read
    uses: francisco-perez-sorrosal/praxion/.github/workflows/reusable-labels-reconcile.yml@778bd3cc28df66adf6bc7f0e84dda6076fbb726a
    with:
      manifest_path: .github/labels.yml
