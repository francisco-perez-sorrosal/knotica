# The Python gate. Runs the `make verify` chain on every push and PR to the
# default branch — the same seven checks, in the same order, so a red build
# names the step a developer would have hit locally.
#
# Actions are SHA-pinned rather than tag-pinned: a tag is mutable, a commit is
# not. The trailing `# vN.N.N` comment is what lets Dependabot's github-actions
# updater (.github/dependabot.yml) bump the pin and the version together.

# The workflow's NAME is load-bearing — do not rename it casually.
# `.github/workflows/ci-autofix.yml` triggers on `workflows: ["Dashboard", "CI"]`,
# and GitHub requires that list to be a static literal, so the autofix hub is
# coupled to this file by name alone. Nothing validates the reference: before
# this workflow existed, the "CI" half of that list pointed at nothing and
# failed silently. Renaming this reintroduces exactly that dangling reference —
# the hub would simply stop firing rather than error. `.github/autofix-policy.yml`
# keeps a hand-maintained copy of the same list; change all three together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}  # least-privilege; the job below grants only what it needs

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    # The suite alone measures ~6.5 min on a dev machine; the rest of the chain
    # is seconds. 20 leaves headroom for a slower shared runner.
    timeout-minutes: 20

    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 3.12 is the `requires-python` floor in pyproject.toml, and deliberately
      # NOT the 3.13 the maintainer runs locally. `make verify` already covers
      # 3.13 on the dev machine every commit, so pinning CI to the floor gates
      # the contract the package actually publishes instead of re-testing what
      # is already tested. A failure that reproduces only here is a real finding
      # about the floor — widen to a 3.12/3.13 matrix rather than raising this.
      - name: Set up uv (manages Python 3.12)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"

      # `--extra evals` matches the Makefile exactly: the eval-facing tests are
      # meant to import the real anthropic/dspy, not whatever a bare sync leaves
      # in the venv.
      #
      # `--locked` (assert the lock is current) rather than `--frozen` (use the
      # lock as-is, unchecked): the two are easy to confuse and only the former
      # fails when someone edits pyproject.toml dependencies and forgets to
      # re-lock. Under `--frozen` that lands green against a stale lock, which is
      # the silent half of the failure mode td-017 documents.
      - name: Install dependencies
        run: uv sync --locked --extra evals

      # The seven steps below mirror the Makefile's `verify` target, in order.
      # That target is the source of truth and NOTHING enforces that these agree
      # — if you add or reorder a check there, change it here in the same commit.
      # `--frozen` on each run: the sync above already established the
      # environment, so these must never take it upon themselves to touch the
      # lockfile.
      - name: Test topology
        run: uv run --frozen --extra evals python scripts/test_group.py --check

      - name: ADR health
        run: uv run --frozen --extra evals python scripts/check_adr_health.py

      - name: Architecture coverage
        run: uv run --frozen --extra evals python scripts/check_architecture_coverage.py

      - name: Types
        run: uv run --frozen --extra evals mypy src/knotica

      - name: Tests
        run: uv run --frozen --extra evals pytest

      - name: Lint
        run: uv run --frozen --extra evals ruff check .

      - name: Format
        run: uv run --frozen --extra evals ruff format --check .
